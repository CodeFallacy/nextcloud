name: Build Nextcloud

on:
  push:
    branches:
      - production

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build Nextcloud & Push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=32.0.11
            type=raw,value=build-${{ github.run_number }}

      - name: Extract ARM64 alias tags
        id: arm_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=aarch64
            type=raw,value=arm64

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push ARM64 image aliases
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.arm_meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      #       "PORT=${{ secrets.SV_PORT }}"
      #       "CAPTCHAKEY=${{ secrets.CAPTCHAKEY }}"
      #       "PB_URL=${{ secrets.PB_URL }}"
